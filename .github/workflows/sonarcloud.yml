name: SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/venv*/**,**/.venv/**,**/__pycache__/**
            -Dsonar.test.exclusions=**/tests/**,**/test_*.py,**/*_test.py
            -Dsonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py
